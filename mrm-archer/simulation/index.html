<style>
:root{
  --paper:#f7f8fa; --surface:#ffffff; --surface-2:#f0f3f7; --ink:#1b2333; --muted:#5b6474;
  --line:#e3e7ee; --accent:#0e6b7c; --accent-weak:#0e6b7c14; --accent-ink:#0b525f;
  --good:#1f8a5b; --good-bg:#1f8a5b1a; --warn:#b7791f; --warn-bg:#b7791f1f;
  --crit:#c0392b; --crit-bg:#c0392b1a; --info:#2b6cb0; --info-bg:#2b6cb01a;
  --t1:#c0392b; --t2:#b7791f; --t3:#2b8a6a; --t0:#8a94a6;
  --shadow:0 1px 2px #1b23330d,0 4px 16px #1b233310; --radius:10px;
  --mono:"SF Mono","Cascadia Code",ui-monospace,"Menlo",monospace;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0e141f; --surface:#161d2b; --surface-2:#1b2434; --ink:#e7ebf2; --muted:#93a0b4;
    --line:#28313f; --accent:#2aa7ba; --accent-weak:#2aa7ba1f; --accent-ink:#7fd3df;
    --good:#3cc489; --good-bg:#3cc48920; --warn:#e0a441; --warn-bg:#e0a44120;
    --crit:#e56b5e; --crit-bg:#e56b5e20; --info:#5aa2e0; --info-bg:#5aa2e020;
    --t1:#e56b5e; --t2:#e0a441; --t3:#3cc489; --t0:#7c8798;
    --shadow:0 1px 2px #0006,0 6px 20px #0007;
  }
}
:root[data-theme="dark"]{
  --paper:#0e141f; --surface:#161d2b; --surface-2:#1b2434; --ink:#e7ebf2; --muted:#93a0b4;
  --line:#28313f; --accent:#2aa7ba; --accent-weak:#2aa7ba1f; --accent-ink:#7fd3df;
  --good:#3cc489; --good-bg:#3cc48920; --warn:#e0a441; --warn-bg:#e0a44120;
  --crit:#e56b5e; --crit-bg:#e56b5e20; --info:#5aa2e0; --info-bg:#5aa2e020;
  --t1:#e56b5e; --t2:#e0a441; --t3:#3cc489; --t0:#7c8798; --shadow:0 1px 2px #0006,0 6px 20px #0007;
}
:root[data-theme="light"]{
  --paper:#f7f8fa; --surface:#ffffff; --surface-2:#f0f3f7; --ink:#1b2333; --muted:#5b6474;
  --line:#e3e7ee; --accent:#0e6b7c; --accent-weak:#0e6b7c14; --accent-ink:#0b525f;
  --good:#1f8a5b; --good-bg:#1f8a5b1a; --warn:#b7791f; --warn-bg:#b7791f1f;
  --crit:#c0392b; --crit-bg:#c0392b1a; --info:#2b6cb0; --info-bg:#2b6cb01a;
  --t1:#c0392b; --t2:#b7791f; --t3:#2b8a6a; --t0:#8a94a6; --shadow:0 1px 2px #1b23330d,0 4px 16px #1b233310;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink);text-decoration:none}
::selection{background:var(--accent-weak)}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
/* Sidebar */
.sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;display:flex;gap:11px;align-items:center;border-bottom:1px solid var(--line)}
.brand .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.5px;flex:none}
.brand b{font-size:14.5px;letter-spacing:-.2px;display:block}
.brand span{font-size:11px;color:var(--muted)}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:12px 10px 5px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);font-weight:500;font-size:13.5px;cursor:pointer}
.nav a .ic{width:17px;height:17px;flex:none;opacity:.75}
.nav a:hover{background:var(--surface-2)}
.nav a.active{background:var(--accent-weak);color:var(--accent-ink);font-weight:600}
.nav a.active .ic{opacity:1}
.nav a .badge{margin-left:auto;font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:0 7px;font-variant-numeric:tabular-nums;color:var(--muted)}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
/* Main */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 22px}
.topbar h1{font-size:16px;margin:0;letter-spacing:-.3px;font-weight:650}
.topbar .sub{color:var(--muted);font-size:12px}
.topbar .sp{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:12.5px;font-weight:500;box-shadow:var(--shadow)}
.tbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.tbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.tbtn.primary:hover{filter:brightness(1.06);color:#fff}
.tbtn.ghost{background:transparent;box-shadow:none}
.view{padding:22px;max-width:1280px;width:100%}
.view h2.vtitle{font-size:19px;margin:0 0 3px;letter-spacing:-.3px}
.view p.vlead{color:var(--muted);margin:0 0 18px;font-size:13px;max-width:70ch}
/* Cards / KPI */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpi{padding:15px 16px;position:relative;overflow:hidden}
.kpi .lab{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .num{font-size:30px;font-weight:700;letter-spacing:-1px;margin-top:5px;font-variant-numeric:tabular-nums;line-height:1}
.kpi .meta{font-size:11.5px;color:var(--muted);margin-top:5px}
.kpi .stripe{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.good .stripe{background:var(--good)} .kpi.warn .stripe{background:var(--warn)} .kpi.crit .stripe{background:var(--crit)} .kpi.info .stripe{background:var(--info)}
.panels{grid-template-columns:1.3fr 1fr;align-items:start}
@media(max-width:900px){.panels{grid-template-columns:1fr}}
.panel{padding:16px 18px}
.panel h3{margin:0 0 14px;font-size:14px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.panel h3 .cnt{font-size:11.5px;color:var(--muted);font-weight:500}
/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.t1{color:var(--t1);background:var(--crit-bg)} .chip.t2{color:var(--t2);background:var(--warn-bg)}
.chip.t3{color:var(--t3);background:var(--good-bg)} .chip.t0{color:var(--t0);background:var(--surface-2)}
.chip.good{color:var(--good);background:var(--good-bg)} .chip.warn{color:var(--warn);background:var(--warn-bg)}
.chip.crit{color:var(--crit);background:var(--crit-bg)} .chip.info{color:var(--info);background:var(--info-bg)}
.chip.muted{color:var(--muted);background:var(--surface-2)}
.chip.ai{color:var(--accent-ink);background:var(--accent-weak)}
/* Tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface);cursor:default}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
td .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tname{font-weight:600}
.tsub{font-size:11.5px;color:var(--muted);white-space:normal}
/* Toolbar */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search],.toolbar select,.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;color:var(--ink)}
.toolbar input[type=search]{min-width:220px}
.toolbar input:focus,.toolbar select:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
.toolbar .sp{flex:1}
/* Bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:130px 1fr 34px;align-items:center;gap:10px;font-size:12.5px}
.bar .track{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;border-radius:6px;background:var(--accent)}
.bar .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
/* Donut */
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:132px;height:132px;border-radius:50%;flex:none;position:relative}
.donut .hole{position:absolute;inset:20px;background:var(--surface);border-radius:50%;display:grid;place-items:center;text-align:center}
.donut .hole b{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.donut .hole span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.legend .li{display:flex;align-items:center;gap:8px}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
.legend .lv{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:14px}
/* Timeline list */
.list{display:flex;flex-direction:column}
.li-row{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13px}
.li-row:last-child{border-bottom:none}
.li-row .grow{min-width:0}
.li-row .grow .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-row .grow .s{font-size:11.5px;color:var(--muted)}
/* Modal */
.overlay{position:fixed;inset:0;background:#0b1018bb;backdrop-filter:blur(3px);display:flex;justify-content:flex-end;z-index:100;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{width:min(760px,96vw);background:var(--paper);height:100%;overflow-y:auto;box-shadow:-8px 0 40px #0004;animation:slide .2s cubic-bezier(.2,.7,.3,1)}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.drawer .dhead{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);padding:16px 22px;display:flex;align-items:flex-start;gap:12px;z-index:2}
.drawer .dhead .x{margin-left:auto}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--ink);border-color:var(--accent)}
.dbody{padding:18px 22px 40px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-6px 0 18px;flex-wrap:wrap}
.tabs button{background:none;border:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--accent-ink);border-color:var(--accent)}
.dl{display:grid;grid-template-columns:180px 1fr;gap:2px 16px}
.dl dt{color:var(--muted);font-size:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.dl dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.section-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);font-weight:700;margin:20px 0 8px}
/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%}
.field textarea{min-height:64px;resize:vertical;font-family:inherit}
.field .hint{font-size:11px;color:var(--muted)}
.checks{display:flex;gap:16px;flex-wrap:wrap}
.checks label{display:flex;gap:7px;align-items:center;font-weight:500;font-size:13px;color:var(--ink)}
.formfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
/* Criticality calculator */
.calc{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
@media(max-width:920px){.calc{grid-template-columns:1fr}}
.qblock{margin-bottom:18px}
.qrow{display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.qrow .q{font-size:13px}
.qrow .q .w{font-size:11px;color:var(--muted);font-family:var(--mono)}
.result{position:sticky;top:78px}
.gauge{text-align:center;padding:6px 0 12px}
.gauge .big{font-size:46px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}
.gauge .cap{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.sline b{font-variant-numeric:tabular-nums}
.rule-note{font-size:11.5px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 10px;margin-top:10px;line-height:1.4}
.empty{padding:40px;text-align:center;color:var(--muted)}
.tag-tier{font-size:22px;font-weight:800;letter-spacing:-.5px}
code.k{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 6px;border-radius:5px}
.matrix-note{font-size:12px;color:var(--muted);margin:2px 0 14px}
.pill-src{font-family:var(--mono);font-size:11px;color:var(--muted)}
.callout{background:var(--accent-weak);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:10px;padding:14px 16px;font-size:13px;margin-bottom:16px}
.callout b{color:var(--accent-ink)}
.footnote{font-size:11.5px;color:var(--muted);margin-top:24px;line-height:1.5;border-top:1px solid var(--line);padding-top:14px}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-240px;transition:left .2s;z-index:60}.sidebar.open{left:0}.menu-btn{display:grid!important}}
.menu-btn{display:none}
</style>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">MR</div>
      <div><b>MRM Konsolu</b><span>Model Riski Yönetimi · Simülasyon</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      Prototip v1 · Archer mimarisi<br>Veriler tarayıcıda (localStorage) tutulur.
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="iconbtn menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Menü">≡</button>
      <div><h1 id="pgtitle">Genel Bakış</h1><div class="sub" id="pgsub"></div></div>
      <div class="sp"></div>
      <button class="tbtn ghost" id="themeBtn" title="Tema">◐ Tema</button>
      <button class="tbtn" id="seedBtn" title="Örnek veriyi yükle">↺ Örnek Veri</button>
    </header>
    <div class="view" id="view"></div>
  </div>
</div>
<div id="modal-root"></div>

<script>
"use strict";
/* ============ DURUM / KALICILIK ============ */
const KEY="mrm_sim_v1";
const state={models:[],validations:[],findings:[],metrics:[],pmas:[],changes:[]};
["metrics","pmas","changes"].forEach(k=>{if(!state[k])state[k]=[];});
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.models){Object.assign(state,d);return true;}}catch(e){}return false;}
function uid(p){let n=0;[...state.models,...state.validations,...state.findings].forEach(x=>{const m=(x.id||"").match(/(\d+)$/);if(m)n=Math.max(n,+m[1]);});return p+String(n+1).padStart(4,"0");}

/* ============ SKORLAMA MODELI ============ */
const WEIGHTS={mat:{M1:.30,M2:.15,M3:.25,M4:.20,M5:.10},kar:{K1:.18,K2:.20,K3:.12,K4:.10,K5:.15,K6:.10,K7:.15}};
const QLABEL={
 M1:"Risk tutarı / portföy büyüklüğü / bilanço etkisi",M2:"Etkilenen müşteri / işlem sayısı",
 M3:"Kararlara etki (fiyatlama/karşılık/sermaye/onay)",M4:"Ödeme gücü / yasal sermaye / finansal raporlama etkisi",
 M5:"İtibar / müşteri / davranışsal etki",
 K1:"Girdi veri niteliği/kalitesi (alternatif/yapılandırılmamış?)",K2:"Metodoloji / varsayım karmaşıklığı",
 K3:"Uygulama bütünlüğü / entegrasyon karmaşıklığı",K4:"Kullanım sıklığı ve yaygınlığı",
 K5:"Açıklanabilirlik / şeffaflık / yorumlanabilirlik (opaklık)",K6:"Tasarımcı / veri yanlılığı potansiyeli",
 K7:"Otonomi / dinamik yeniden kalibrasyon"};
const ORDER=["İhmal Edilebilir","Tier 3","Tier 2","Tier 1"];
function scoreCrit(c){
 c=c||{};
 let mat=0;for(const k in WEIGHTS.mat)mat+=(+c[k]||0)*WEIGHTS.mat[k];
 let kar=0;for(const k in WEIGHTS.kar)kar+=(+c[k]||0)*WEIGHTS.kar[k];
 const icsel=+(mat*kar).toFixed(2);
 let tier= icsel>=15?"Tier 1":icsel>=8?"Tier 2":icsel>=3?"Tier 3":"İhmal Edilebilir";
 const rules=[];
 const bump=(min,why)=>{if(ORDER.indexOf(tier)<ORDER.indexOf(min)){tier=min;rules.push(why);}};
 if(c.duzenleyici){bump("Tier 2","Düzenleyici/sermaye kullanımı → min. Tier 2, 'İhmal Edilebilir' seçilemez");}
 if((+c.O1||0)>=3){bump("Tier 2","Tam otonom karar (O1=3) → min. Tier 2");}
 if(c.genai){bump("Tier 2","GenAI/temel model → min. Tier 2 (AI/ML ek değerlendirmesi zorunlu)");}
 if((+c.B1||0)>=3){const i=ORDER.indexOf(tier);if(i<ORDER.length-1){tier=ORDER[i+1];rules.push("Çok sayıda downstream bağımlılık (B1=3) → tier bir kademe yükseldi");}}
 const derece= icsel>=15?"Yüksek":icsel>=8?"Orta":"Düşük";
 return {mat:+mat.toFixed(2),kar:+kar.toFixed(2),icsel,tier,derece,rules};
}
const FREQMON={"Yıllık":12,"2 Yıllık":24,"3 Yıllık":36,"Olay-Tetikli":0};
function tierFreq(t){return t==="Tier 1"?"Yıllık":t==="Tier 2"?"2 Yıllık":t==="Tier 3"?"3 Yıllık":"Olay-Tetikli";}
function addMonths(ds,m){if(!ds||!m)return"";const d=new Date(ds);d.setMonth(d.getMonth()+ +m);return d.toISOString().slice(0,10);}
function nextVal(m){const f=FREQMON[m.valFrekans||tierFreq(m.tier)]||0;return m.sonValidasyon&&f?addMonths(m.sonValidasyon,f):"";}
function overdue(next){if(!next)return{t:"—",c:"muted"};const days=(new Date(next)-new Date())/86400000;if(days<0)return{t:"Gecikmiş",c:"crit"};if(days<45)return{t:"Yaklaşan",c:"warn"};return{t:"Zamanında",c:"good"};}
function tierClass(t){return t==="Tier 1"?"t1":t==="Tier 2"?"t2":t==="Tier 3"?"t3":"t0";}
const STATUS_CLASS={"Taslak":"muted","Geliştirme":"info","Validasyonda":"info","Onayda":"warn","Onaylı/Prod":"good","İzlemede":"good","Revalidasyonda":"warn","Koşullu Onaylı":"warn","Kısıtlı/Askıda":"crit","Emekli":"muted"};

/* ============ ORNEK VERI ============ */
function seed(){

const METRIC_DEF={PSI:{dir:"low",esik:0.25,lab:"PSI (drift)"},CSI:{dir:"low",esik:0.25,lab:"CSI"},AUC:{dir:"high",esik:0.70,lab:"AUC"},Gini:{dir:"high",esik:0.40,lab:"Gini"},KS:{dir:"high",esik:0.30,lab:"KS"}};
function isBreach(tur,deger,esik){const d=METRIC_DEF[tur];if(!d)return false;return d.dir==="low"?(+deger>+esik):(+deger<+esik);}
function latestMetric(modelId,tur){const a=(state.metrics||[]).filter(m=>m.modelId===modelId&&m.tur===tur).sort((x,y)=>new Date(x.tarih)-new Date(y.tarih));return a[a.length-1];}
function modelMetricTypes(modelId){return [...new Set((state.metrics||[]).filter(m=>m.modelId===modelId).map(m=>m.tur))];}
function modelBreaching(modelId){return modelMetricTypes(modelId).some(t=>{const l=latestMetric(modelId,t);return l&&isBreach(t,l.deger,l.esik);});}
function refreshMonitorStatus(){state.models.forEach(m=>{const types=modelMetricTypes(m.id);if(!types.length)return;m.izlemeDurumu=modelBreaching(m.id)?"Eşik Aşımı":"Normal";});}

function buildNav(){
 const nav=document.getElementById("nav");nav.innerHTML="";
 NAV.forEach(n=>{
  if(n.grp){const d=document.createElement("div");d.className="grp";d.textContent=n.grp;nav.appendChild(d);return;}
  const a=document.createElement("a");a.dataset.id=n.id;
  let badge="";
  if(n.id==="envanter")badge=state.models.length;
  if(n.id==="aiml")badge=state.models.filter(m=>m.aiml).length;
  if(n.id==="validasyon")badge=state.validations.length;
  if(n.id==="izleme"){const b=state.models.filter(m=>modelBreaching(m.id)).length;badge=b||"";}
  if(n.id==="degisiklik")badge=(state.changes||[]).length;
  if(n.id==="pma")badge=(state.pmas||[]).length;
  if(n.id==="bulgular")badge=state.findings.filter(f=>f.durum!=="Kapandı").length;
  a.innerHTML=`<span class="ic">${n.ic}</span><span>${n.t}</span>${badge!==""?`<span class="badge">${badge}</span>`:""}`;
  a.onclick=()=>go(n.id);
  nav.appendChild(a);
 });
}

 return `<div class="qrow"><div class="q">${QLABEL[k]||k} ${w?`<span class="w">a=${w.toFixed(2)}</span>`:""}</div>

function renderCrit(){
 document.getElementById("mat-qs").innerHTML=["M1","M2","M3","M4","M5"].map(k=>qrow(k,5)).join("");
 document.getElementById("kar-qs").innerHTML=["K1","K2","K3","K4","K5","K6","K7"].map(k=>qrow(k,5)).join("");

   qrow("B1",3).replace(QLABEL.B1||"","B1 – Downstream (beslenen) model/karar bağımlılığı (0-3)")+
   qrow("O1",3).replace(QLABEL.O1||"","O1 – İnsan gözetimi olmadan otomatik karara girme (0-3)")+
   `<div class="qrow"><div class="q">Düzenleyici / sermaye kullanımı (IRB, İSEDES, TFRS9, piyasa/AMA)</div><label style="justify-self:end"><input type="checkbox" data-c="duzenleyici" ${critState.c.duzenleyici?"checked":""}> Evet</label></div>

 document.querySelectorAll("[data-c]").forEach(e=>{
   const k=e.dataset.c;
   const h=()=>{critState.c[k]=e.type==="checkbox"?e.checked:+e.value;renderResult();};
   e.onchange=h;
 });
 renderResult();
}
function renderResult(){
 const s=scoreCrit(critState.c);

 el.innerHTML=`

   <div class="sline"><span>Karmaşıklık</span><b>${s.kar} / 5</b></div>
   <div class="sline"><span>Model Risk Derecesi</span><b>${s.derece}</b></div>

   ${s.rules.length?`<div class="rule-note"><b>Sert kural(lar):</b><br>${s.rules.map(r=>"• "+esc(r)).join("<br>")}</div>`:""}
   ${critState.modelId?`<button class="tbtn primary" style="width:100%;justify-content:center;margin-top:14px" onclick="applyCrit()">“${esc(model?model.ad:"")}” modeline uygula</button>`:`<div class="hint" style="margin-top:12px;font-size:11.5px">Bir model seçip skoru kalıcı olarak yazabilirsiniz.</div>`}
 `;
}
window.applyCrit=function(){
 const m=state.models.find(x=>x.id===critState.modelId);if(!m)return;
 m.crit=Object.assign({},critState.c);m.duzenleyici=!!critState.c.duzenleyici;m.genai=!!critState.c.genai;if(m.genai)m.aiml=true;
 const s=scoreCrit(m.crit);Object.assign(m,{mat:s.mat,kar:s.kar,icsel:s.icsel,tier:s.tier,derece:s.derece});
 if(!m.valFrekans)m.valFrekans=tierFreq(s.tier);
 save();

};

 if(f.t==="sel")return `<div class="field"><label>${f.l}</label><select data-a="${f.k}">${f.o.map(o=>`<option ${(v||"—")===o?"selected":""}>${o}</option>`).join("")}</select></div>`;
 if(f.t==="multi")return `<div class="field full"><label>${f.l}</label><div class="checks">${f.o.map(o=>`<label style="font-weight:500;color:var(--ink)"><input type="checkbox" data-a="${f.k}" data-multi="1" value="${o}" ${(v||[]).includes(o)?"checked":""}> ${o}</label>`).join("")}</div></div>`;
 if(f.t==="num")return `<div class="field"><label>${f.l}</label><input type="number" ${f.step?`step="${f.step}"`:""} data-a="${f.k}" value="${v==null?"":v}" placeholder="${f.ph||""}">${f.hint?`<span class="hint">${f.hint}</span>`:""}</div>`;

function aimlChecks(m){
 const a=m.aimlEk||{};const genai=!!m.genai;
 const credit=(m.kategori||[]).some(k=>/Kredi|IRB|BKZ/.test(k))||m.duzenleyici;
 const set=x=>x!=null&&x!==""&&x!=="—";
 const out=[];
 out.push({label:"Açıklanabilirlik yöntemi",status:set(a.aciklanabilirlikYontem)?(credit&&!a.reasonCode?"warn":"good"):"crit",note:set(a.aciklanabilirlikYontem)?(credit&&!a.reasonCode?"Kredi kullanımı için reason-code yeteneği gerekli":a.aciklanabilirlikYontem):"Yöntem seçilmemiş (SHAP/LIME…)"});
 const di=parseFloat(a.disparateImpact);let fs,fn;
 if(isNaN(di)){fs="crit";fn="Disparate impact test edilmemiş";}
 else if(di>=0.8){fs="good";fn="4/5 kuralı sağlanıyor ("+di+")";}
 else if(di>=0.7){fs="warn";fn="4/5 sınırında ("+di+")";}
 else{fs="crit";fn="4/5 kuralı ihlali ("+di+")";}
 out.push({label:"Yanlılık / adalet (disparate impact)",status:fs,note:fn});
 let ds=a.temsil==="Temsil Ediyor"?"good":a.temsil==="Kısmen"?"warn":"crit";
 let dn=set(a.temsil)?"Temsil: "+a.temsil:"Temsil değerlendirilmemiş";
 if(a.pii&&!set(a.piiKontrol)){if(ds==="good")ds="warn";dn+=" · PII kontrolü eksik";}
 out.push({label:"Veri temsili & gizlilik",status:ds,note:dn});
 const psi=parseFloat(a.psiSon);let gs,gn;
 if(isNaN(psi)){gs="crit";gn="Drift (PSI) izlenmiyor";}
 else if(psi<0.10){gs="good";gn="PSI "+psi+" (stabil)";}
 else if(psi<0.25){gs="warn";gn="PSI "+psi+" (izle)";}
 else{gs="crit";gn="PSI "+psi+" — drift! aksiyon";}
 out.push({label:"Drift izleme (PSI)",status:gs,note:gn});
 out.push({label:"Robustluk & güvenlik testi",status:a.robustlukTest?(genai&&!a.adversarialTest?"warn":"good"):"warn",note:a.robustlukTest?(genai&&!a.adversarialTest?"GenAI için adversarial/jailbreak testi eksik":""):"Robustluk testi yapılmamış"});
 out.push({label:"Tekrarüretilebilirlik",status:a.reproducibility?"good":"warn",note:a.reproducibility?"":"Reproducibility manifestosu eksik"});
 out.push({label:"Retraining yönetişimi",status:set(a.retrainFrekans)?"good":"warn",note:set(a.retrainFrekans)?"Frekans: "+a.retrainFrekans:"Retraining frekansı tanımsız"});
 out.push({label:"İnsan gözetimi",status:a.insanGozetim?"good":(credit?"crit":"warn"),note:a.insanGozetim?(a.insanRol||""):"İnsan gözetimi işaretli değil"});
 let es=a.euAiKategori==="Yüksek Risk"?(set(a.etikFRIA)?"good":"warn"):set(a.euAiKategori)?"good":"warn";
 out.push({label:"Etik / EU AI Act",status:es,note:set(a.euAiKategori)?("Kategori: "+a.euAiKategori+(a.euAiKategori==="Yüksek Risk"&&!set(a.etikFRIA)?" · FRIA gerekli":"")):"EU AI Act kategorisi belirlenmemiş"});
 if(genai){
   const he=parseFloat(a.halusinasyonEsik),hs2=parseFloat(a.halusinasyonSon);let hs,hn;
   if(!set(a.guardrailModeller)||isNaN(he)){hs="crit";hn="Guardrail/halüsinasyon eşiği tanımsız";}
   else if(!isNaN(hs2)&&hs2>he){hs="warn";hn="Halüsinasyon skoru eşiği aşıyor ("+hs2+" > "+he+")";}
   else{hs="good";hn="Guardrail aktif, eşik içinde";}
   out.push({label:"GenAI guardrail & halüsinasyon",status:hs,note:hn});
   const tm=set(a.temelModel)&&set(a.saglayici)&&set(a.lisans);
   out.push({label:"GenAI temel model / 3. taraf",status:tm?"good":"warn",note:tm?(a.saglayici):"Temel model/sağlayıcı/lisans bilgisi eksik"});
 }else{
   out.push({label:"GenAI guardrail & halüsinasyon",status:"na",note:"GenAI değil"});
 }
 return out;
}
function renderAimlInd(){

 const scored=checks.filter(c=>c.status!=="na");
 const pass=scored.filter(c=>c.status==="good").length;
 const warnN=scored.filter(c=>c.status==="warn").length;
 const critN=scored.filter(c=>c.status==="crit").length;
 const pct=scored.length?Math.round(pass/scored.length*100):0;

 document.getElementById("aiml-ind").innerHTML=`

   <div class="list">${checks.map(c=>`<div class="li-row" style="padding:8px 2px"><span class="chip ${c.status==='na'?'muted':c.status}" style="padding:0 8px;min-width:22px;justify-content:center">${ico[c.status]}</span><div class="grow"><div class="t" style="white-space:normal;font-size:12.5px">${esc(c.label)}</div>${c.note?`<div class="s" style="white-space:normal">${esc(c.note)}</div>`:""}</div></div>`).join("")}</div>

function aimlGaps(){

 const gaps=aimlChecks(m).filter(c=>c.status==="warn"||c.status==="crit");
 if(!gaps.length){alert("Açık AI/ML boşluğu yok — tüm kontroller geçti.");return;}
 let n=0;
 gaps.forEach(g=>{

 });
 save();buildNav();
 alert(n?`${n} bulgu oluşturuldu (Bulgular ekranında).`:"Bu boşluklar için bulgu zaten mevcut.");
}

let izlSel="";
function sparkline(vals,esik,dir,w=280,h=56){
 if(!vals.length)return "";
 const all=vals.concat([esik]);let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo)*0.15||0.05;lo-=pad;hi+=pad;
 const X=i=>vals.length>1?(i/(vals.length-1))*(w-8)+4:w/2;
 const Y=x=>h-5-((x-lo)/(hi-lo))*(h-10);
 const pts=vals.map((x,i)=>`${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join(" ");
 const ty=Y(esik).toFixed(1);const last=vals[vals.length-1];
 const breach=dir==="low"?last>esik:last<esik;const col=breach?"var(--crit)":"var(--good)";
 const area=`4,${(h-4)} ${pts} ${X(vals.length-1).toFixed(1)},${(h-4)}`;
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block">
   <polygon points="${area}" fill="${col}" opacity="0.08"/>
   <line x1="0" y1="${ty}" x2="${w}" y2="${ty}" stroke="var(--warn)" stroke-width="1" stroke-dasharray="3 3" opacity="0.85"/>
   <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${X(vals.length-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="3.2" fill="${col}"/></svg>`;
}

   const series=(state.metrics||[]).filter(x=>x.modelId===m.id&&x.tur===t).sort((a,b)=>new Date(a.tarih)-new Date(b.tarih));
   const vals=series.map(s=>+s.deger);const last=series[series.length-1];const esik=last?+last.esik:d.esik;
   const br=last&&isBreach(t,last.deger,esik);
   return `<div class="card panel" style="padding:14px 16px">
     <div style="display:flex;align-items:baseline;gap:8px"><h3 style="margin:0;font-size:14px">${d.lab||t}</h3><span class="chip ${br?'crit':'good'}" style="margin-left:auto">${br?'Eşik Aşımı':'Normal'}</span></div>

     ${sparkline(vals,esik,d.dir)}
     <div class="tsub" style="margin-top:6px">${series.length} ölçüm · son: ${last?last.tarih:"—"}</div>
   </div>`;
 }).join("");
 const rows=(state.metrics||[]).filter(x=>x.modelId===m.id).sort((a,b)=>new Date(b.tarih)-new Date(a.tarih)).slice(0,40);
 document.getElementById("izl-body").innerHTML=`
   <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">${statusChip2b(m.izlemeDurumu||"Normal")} ${tierChip(m.tier)} <span class="tsub">${esc(m.ad)}</span></div>
   ${types.length?`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-bottom:16px">${cards}</div>`:`<div class="card empty" style="margin-bottom:16px">Bu model için metrik yok. Aşağıdan ölçüm ekleyin.</div>`}
   <div class="card panel">
     <h3>Ölçüm Ekle</h3>
     <div class="form-grid">
       <div class="field"><label>Metrik</label><select id="mt-tur">${Object.keys(METRIC_DEF).map(k=>`<option>${k}</option>`).join("")}</select></div>
       <div class="field"><label>Tarih</label><input id="mt-tarih" type="date"></div>
       <div class="field"><label>Değer</label><input id="mt-deger" type="number" step="0.01"></div>
       <div class="field"><label>Eşik</label><input id="mt-esik" type="number" step="0.01"></div>
     </div>
     <div class="formfoot" style="border:none;padding-top:12px"><button class="tbtn primary" id="mt-add">Ölçüm Ekle</button></div>
   </div>
   <div class="section-h">Son Ölçümler</div>
   <div class="tablewrap"><table><thead><tr><th>Tarih</th><th>Metrik</th><th class="num">Değer</th><th class="num">Eşik</th><th>Durum</th></tr></thead><tbody>
    ${rows.map(r=>{const br=isBreach(r.tur,r.deger,r.esik);return `<tr style="cursor:default"><td>${r.tarih}</td><td>${r.tur}</td><td class="num">${(+r.deger).toFixed(2)}</td><td class="num">${r.esik}</td><td><span class="chip ${br?'crit':'good'}" style="padding:0 7px">${br?'Aşım':'Normal'}</span></td></tr>`;}).join("")||`<tr><td colspan="5"><div class="empty">Ölçüm yok.</div></td></tr>`}
   </tbody></table></div>`;
 const turEl=document.getElementById("mt-tur");
 const fillEsik=()=>{document.getElementById("mt-esik").value=METRIC_DEF[turEl.value].esik;};
 turEl.onchange=fillEsik;fillEsik();
 document.getElementById("mt-add").onclick=()=>{
   const tur=turEl.value,tarih=document.getElementById("mt-tarih").value,deger=document.getElementById("mt-deger").value,esik=document.getElementById("mt-esik").value;
   if(!tarih||deger===""){alert("Tarih ve değer zorunludur.");return;}
   state.metrics.push({id:"MET-"+Date.now(),modelId:m.id,tarih,tur,deger:+deger,esik:+(esik||METRIC_DEF[tur].esik)});
   refreshMonitorStatus();save();renderIzleme();
 };
}
function statusChip2b(s){const c={"Normal":"good","Uyarı":"warn","Eşik Aşımı":"crit","İstisna":"warn"}[s]||"muted";return `<span class="chip dot ${c}">${esc(s)}</span>`;}
function izlGaps(){
 const m=state.models.find(x=>x.id===izlSel);let n=0;
 modelMetricTypes(m.id).forEach(t=>{const l=latestMetric(m.id,t);if(l&&isBreach(t,l.deger,l.esik)){
   const title="[İzleme] "+t+" eşik aşımı";
   if(state.findings.some(f=>f.modelId===m.id&&f.baslik===title))return;
   state.findings.push({id:uid("FND-"),modelId:m.id,baslik:title,kaynak:"İzleme",onem:t==="PSI"||t==="CSI"?"Yüksek":"Orta",durum:"Planlanıyor",sahip:m.sahip||""});n++;
 }});
 save();buildNav();alert(n?`${n} bulgu oluşturuldu.`:"Eşik aşımı yok ya da bulgular zaten mevcut.");
}

window.chgForm=function(id){
 const c=id?JSON.parse(JSON.stringify((state.changes||[]).find(x=>x.id===id))):{tur:"Rekalibrasyon",materyalite:"Materyal Değil",revalidasyon:"Hayır",onay:"Beklemede"};

    ${fld("Yeni Versiyon","versiyon",c.versiyon,"text")}
    ${fldSel("Değişiklik Türü","tur",c.tur,["Rekalibrasyon","Yeniden Geliştirme","Metodoloji","Veri Kaynağı","Retraining","Parametre","Kod/Sistem"])}
    ${fld("Açıklama","aciklama",c.aciklama,"textarea",false,true)}
    ${fldSel("Materyalite","materyalite",c.materyalite,["Materyal Değil","Materyal"])}
    ${fldSel("Revalidasyon Gerekli","revalidasyon",c.revalidasyon,["Hayır","Evet"])}
    ${fldSel("Onay","onay",c.onay,["Beklemede","Onaylandı","Reddedildi"])}
    ${fld("Tarih","tarih",c.tarih,"date")}
   </div>
   <div class="callout" style="margin-top:14px">Materyalite=<b>Materyal</b>, Revalidasyon=<b>Evet</b> ve Onay=<b>Onaylandı</b> olduğunda model Revalidasyonda durumuna alınır ve revalidasyon kaydı açılır.</div>
   <div class="formfoot">${id?`<button class="tbtn" style="color:var(--crit);border-color:var(--crit)" onclick="delChg('${id}')">Sil</button>`:""}<div style="flex:1"></div><button class="tbtn" onclick="closeDrawer()">Vazgeç</button><button class="tbtn primary" onclick="saveChg('${id||""}')">Kaydet</button></div>`);
};
window.saveChg=function(id){
 const g=n=>{const e=document.querySelector(`[data-f="${n}"]`);return e?e.value.trim():"";};
 const obj=Object.assign(id?(state.changes.find(x=>x.id===id)):{},{
   id:id||uid("CHG-"),modelId:g("modelId"),versiyon:g("versiyon"),tur:g("tur"),aciklama:g("aciklama"),
   materyalite:g("materyalite"),revalidasyon:g("revalidasyon"),onay:g("onay"),tarih:g("tarih")});
 if(id){const i=state.changes.findIndex(x=>x.id===id);state.changes[i]=obj;}else state.changes.push(obj);
 let msg="";
 if(obj.materyalite==="Materyal"&&obj.revalidasyon==="Evet"&&obj.onay==="Onaylandı"&&!obj.valOlusturuldu){
   const m=state.models.find(x=>x.id===obj.modelId);
   if(m){m.durum="Revalidasyonda";
     state.validations.push({id:uid("VAL-"),baslik:m.ad+" – Revalidasyon (değişiklik tetikli)",modelId:m.id,tur:"Hedefli (Materyal Değişiklik)",tetik:"Materyal Değişiklik",validator:m.validator||"Bağımsız Validasyon Birimi",bagimsizlik:"Tam Bağımsız-Ayrı Hat",oneri:"",rating:"",onayKarar:"Beklemede",onayMakam:"Model Risk Komitesi",durum:"Planlandı"});
     obj.valOlusturuldu=true;msg="Model 'Revalidasyonda' durumuna alındı ve revalidasyon kaydı açıldı.";
   }
 }
 save();closeDrawer();render();if(msg)setTimeout(()=>alert(msg),50);
};
window.delChg=function(id){if(!confirm("Değişiklik kaydı silinsin mi?"))return;state.changes=state.changes.filter(x=>x.id!==id);save();closeDrawer();render();};

/* ============ DRAWER ============ */
function openDrawer(head,body){
 const r=document.getElementById("modal-root");
 r.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeDrawer()"><div class="drawer"><div class="dhead">${head}</div><div class="dbody">${body}</div></div></div>`;
 document.body.style.overflow="hidden";
}
window.closeDrawer=function(){document.getElementById("modal-root").innerHTML="";document.body.style.overflow="";};

/* ============ TEMA ============ */
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);localStorage.setItem("mrm_theme",t);}
document.getElementById("themeBtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");applyTheme(cur==="dark"?"light":"dark");};
document.getElementById("seedBtn").onclick=()=>{if(confirm("Tüm veriler örnek sete sıfırlansın mı?")){seed();buildNav();render();}};

/* ============ INIT ============ */
(function init(){
 const th=localStorage.getItem("mrm_theme");if(th)applyTheme(th);
 if(!load())seed();
 buildNav();
 const h=(location.hash||"").replace("#","");if(NAV.find(n=>n.id===h))current=h;
 window.addEventListener("hashchange",()=>{const h=location.hash.replace("#","");if(NAV.find(n=>n.id===h)&&h!==current){current=h;render();}});
 render();
})();
</script>
