<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Event Dashboard 2026</title>
<style>
:root{
  --bg-main:#f8fafc; --card-bg:#ffffff; --text-primary:#0f172a; --text-secondary:#475569;
  --accent-blue:#2563eb; --border-color:#e2e8f0;
  --shadow-sm:0 1px 3px rgba(0,0,0,.05);
  --shadow-md:0 10px 15px -3px rgba(0,0,0,.05),0 4px 6px -2px rgba(0,0,0,.02);
  --shadow-hover:0 20px 25px -5px rgba(0,0,0,.1),0 10px 10px -5px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0;
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;}
body{background:var(--bg-main);color:var(--text-primary);padding-bottom:50px;}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  vertical-align:-0.125em;flex:none;}

/* Header */
.dashboard-header{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#fff;padding:24px 40px;box-shadow:var(--shadow-md);}
.header-content{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:16px;}
.brand-icon{font-size:24px;background:#38bdf8;color:#0f172a;padding:12px;border-radius:12px;display:flex;}
.brand h1{font-size:22px;font-weight:700;letter-spacing:-.5px;}
.brand p{font-size:13px;color:#94a3b8;margin-top:2px;}
.search-box{position:relative;width:320px;max-width:100%;}
.search-box .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:15px;}
.search-box input{width:100%;padding:10px 16px 10px 40px;background:#334155;border:1px solid #475569;border-radius:20px;
  color:#fff;font-size:13px;outline:none;transition:all .2s;}
.search-box input::placeholder{color:#94a3b8;}
.search-box input:focus{border-color:#38bdf8;background:#1e293b;}

.container{max-width:1400px;margin:30px auto;padding:0 20px;}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:30px;}
.kpi-card{background:var(--card-bg);padding:20px;border-radius:16px;border:1px solid var(--border-color);
  display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-sm);transition:transform .2s;}
.kpi-card:hover{transform:translateY(-3px);}
.kpi-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.kpi-icon.blue{background:#dbeafe;color:#2563eb}.kpi-icon.green{background:#d1fae5;color:#059669}
.kpi-icon.purple{background:#ede9fe;color:#7c3aed}.kpi-icon.orange{background:#ffedd5;color:#ea580c}
.kpi-value{display:block;font-size:24px;font-weight:800;}
.kpi-label{font-size:12px;color:var(--text-secondary);font-weight:500;}

/* Controls */
.controls-bar{background:var(--card-bg);padding:16px 24px;border-radius:16px;border:1px solid var(--border-color);
  display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;flex-wrap:wrap;gap:15px;}
.filter-group{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;}
.filter-group label{display:flex;align-items:center;gap:6px;}
.filter-group select{padding:8px 14px;border-radius:8px;border:1px solid var(--border-color);outline:none;
  background:#f8fafc;font-size:13px;cursor:pointer;color:var(--text-primary);}
.view-switch{display:flex;gap:8px;}
.btn-view{padding:8px 16px;border-radius:8px;border:1px solid var(--border-color);background:#fff;color:var(--text-secondary);
  cursor:pointer;font-weight:600;font-size:13px;transition:all .2s;display:flex;align-items:center;gap:6px;}
.btn-view.active,.btn-view:hover{background:var(--text-primary);color:#fff;border-color:var(--text-primary);}

/* Timeline */
.timeline{position:relative;padding:20px 0;}
.timeline::before{content:'';position:absolute;top:0;bottom:0;left:200px;width:3px;background:#cbd5e1;border-radius:2px;}
.timeline.is-empty::before{display:none;}
.timeline-item{position:relative;display:flex;margin-bottom:30px;align-items:flex-start;}
.timeline-date{width:170px;text-align:right;padding-right:30px;font-weight:700;font-size:14px;margin-top:15px;}
.timeline-badge{position:absolute;left:191px;top:18px;width:20px;height:20px;border-radius:50%;background:#fff;
  border:4px solid var(--accent-blue);z-index:2;box-shadow:0 0 0 4px rgba(37,99,235,.15);}
.timeline-card{margin-left:50px;background:var(--card-bg);border:1px solid var(--border-color);border-radius:16px;
  padding:20px 24px;flex:1;box-shadow:var(--shadow-sm);transition:all .2s ease;cursor:pointer;text-align:left;width:100%;}
.timeline-card:hover{transform:translateX(5px);box-shadow:var(--shadow-hover);border-color:#cbd5e1;}
.card-tags{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.tag{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;}
.tag-format{background:#f1f5f9;color:var(--text-secondary);}
.card-title{font-size:18px;font-weight:700;margin-bottom:8px;}
.card-meta{display:flex;gap:20px;font-size:13px;color:var(--text-secondary);margin-bottom:12px;flex-wrap:wrap;}
.card-meta span{display:inline-flex;align-items:center;gap:6px;}
.card-desc{font-size:13px;color:#64748b;line-height:1.5;}

/* Cards grid */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:25px;}
.grid-card{background:var(--card-bg);border-radius:16px;border:1px solid var(--border-color);padding:24px;
  display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-sm);transition:all .2s;
  cursor:pointer;text-align:left;width:100%;}
.grid-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-hover);}
.grid-date{font-size:13px;font-weight:700;color:#2563eb;margin:8px 0;display:flex;align-items:center;gap:6px;}
.empty-state{text-align:center;padding:40px;color:#64748b;font-weight:600;width:100%;grid-column:1/-1;}

/* Modal */
.modal{display:none;position:fixed;z-index:100;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);overflow-y:auto;}
.modal.open{display:block;}
.modal-content{background:#fff;margin:8% auto;padding:32px;border-radius:20px;width:90%;max-width:650px;position:relative;
  box-shadow:0 25px 50px -12px rgba(0,0,0,.25);}
.close-btn{position:absolute;right:20px;top:16px;font-size:24px;font-weight:bold;color:#94a3b8;cursor:pointer;
  background:none;border:0;line-height:1;padding:4px 8px;border-radius:8px;}
.close-btn:hover{background:#f1f5f9;color:var(--text-primary);}
.modal h2{font-size:20px;font-weight:800;margin-bottom:12px;padding-right:30px;}
.modal-date{font-size:14px;color:#2563eb;font-weight:700;margin-bottom:15px;display:flex;align-items:center;gap:6px;}
.modal hr{border:0;border-top:1px solid #e2e8f0;margin-bottom:15px;}
.modal-row{font-size:13px;margin-bottom:10px;line-height:1.6;}
.modal-row strong{display:inline-flex;align-items:center;gap:6px;}
.modal-details{font-size:13px;color:#475569;line-height:1.6;margin-top:15px;background:#f8fafc;padding:12px;border-radius:10px;}

@media (max-width:850px){
  .dashboard-header{padding:20px;}
  .timeline::before{left:20px;}
  .timeline-date{width:100%;text-align:left;margin:0 0 8px;padding-left:45px;}
  .timeline-badge{left:11px;top:2px;}
  .timeline-item{flex-direction:column;}
  .timeline-card{margin-left:45px;width:calc(100% - 45px);}
  .search-box{width:100%;}
  .cards-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- Inline SVG ikon kütüphanesi (CDN bağımlılığı yok) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<header class="dashboard-header">
  <div class="header-content">
    <div class="brand">
      <span class="brand-icon"><svg class="ic"><use href="#i-chart"/></svg></span>
      <div>
        <h1>Executive Event Dashboard 2026</h1>
        <p>Teknoloji, Yapay Zekâ ve Finans Konferansları Takvimi</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="search-box">
        <svg class="ic"><use href="#i-search"/></svg>
        <input type="text" id="searchInput" placeholder="Etkinlik, mekan veya konu ara..." autocomplete="off">
      </div>
    </div>
  </div>
</header>

<div class="container">
  <section class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-icon blue"><svg class="ic"><use href="#i-calendar"/></svg></div>
      <div class="kpi-data"><span class="kpi-value" id="statTotal">0</span><span class="kpi-label">Toplam Etkinlik</span></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon green"><svg class="ic"><use href="#i-building"/></svg></div>
      <div class="kpi-data"><span class="kpi-value" id="statPhysical">0</span><span class="kpi-label">Fiziki Zirve</span></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon purple"><svg class="ic"><use href="#i-laptop"/></svg></div>
      <div class="kpi-data"><span class="kpi-value" id="statHybrid">0</span><span class="kpi-label">Hibrit / Online</span></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon orange"><svg class="ic"><use href="#i-layers"/></svg></div>
      <div class="kpi-data"><span class="kpi-value" id="statCategories">0</span><span class="kpi-label">Kategori Çeşitliliği</span></div>
    </div>
  </section>

  <div class="controls-bar">
    <div class="filter-group">
      <label for="categoryFilter"><svg class="ic"><use href="#i-filter"/></svg> Kategori:</label>
      <select id="categoryFilter"><option value="ALL">Tüm Kategoriler</option></select>
    </div>
    <div class="filter-group">
      <label for="formatFilter"><svg class="ic"><use href="#i-pin"/></svg> Format:</label>
      <select id="formatFilter"><option value="ALL">Tüm Formatlar</option></select>
    </div>
    <div class="view-switch">
      <button class="btn-view active" id="btnTimeline"><svg class="ic"><use href="#i-timeline"/></svg> Zaman Çizelgesi</button>
      <button class="btn-view" id="btnCards"><svg class="ic"><use href="#i-grid"/></svg> Kart Görünümü</button>
    </div>
  </div>

  <div id="timelineView" class="view-container"><div class="timeline" id="timelineContent"></div></div>
  <div id="cardsView" class="view-container" style="display:none;"><div class="cards-grid" id="cardsContent"></div></div>
</div>

<div id="eventModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content">
    <button class="close-btn" id="closeModalBtn" aria-label="Kapat">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* ===================== ETKİNLİK VERİ TABANI ===================== */
const EVENTS_DATA = [
  {id:1,title:"AI/ML Summit: AI at Scale",start_date:"2026-09-26",end_date:"2026-09-26",date_display:"26 Eylül 2026",
   format:"Fiziki",location:"Trendyol Maslak Kampüsü, İstanbul",organizer:"Trendyol Tech",category:"Yapay Zekâ / ML",
   theme_description:"Mühendisleri, veri bilimcileri ve teknoloji liderlerini bir araya getiren büyük ölçekli AI/ML zirvesi.",
   details:"Etkinlik ücretsiz olup katılımcılar kontenjanla sınırlandırılmıştır. Başvurular platformlar üzerinden alınmaktadır.",
   badge_color:"#2563eb"},
  {id:2,title:"Istanbul Fintech Week 2026 (IFW2026)",start_date:"2026-10-05",end_date:"2026-10-07",date_display:"5 - 7 Ekim 2026",
   format:"Fiziki",location:"Hilton İstanbul Maslak",organizer:"BEX Digital Wallet Katkılarıyla",category:"Fintech / Blockchain",
   theme_description:"Smart, Embedded, and Tokenized (Akıllı, Gömülü ve Tokenlaştırılmış Finans)",
   details:"Fintech ekosisteminin bölgesel ve küresel liderlerini bir araya getiren kapsamlı finansal teknoloji haftası.",
   badge_color:"#7c3aed"},
  {id:3,title:"Eurasia Technology Week 2026",start_date:"2026-10-07",end_date:"2026-10-09",date_display:"7 - 9 Ekim 2026 (Sergi: 8-9 Ekim)",
   format:"Fiziki",location:"İstanbul Kongre Merkezi (ICC) & IFM",organizer:"Eurasia Tech",category:"Teknoloji / B2B",
   theme_description:"B2B Görüşmeler, Sunumlar, Startup Demosu",
   details:"Hedef Kitle: Yazılım geliştiricileri, Web3 girişimcileri, telekom operatörleri, regülatörler ve teknoloji yatırımcıları.",
   badge_color:"#0891b2"},
  {id:4,title:"Developer Summit 2026 (Devnot)",start_date:"2026-10-17",end_date:"2026-10-17",date_display:"17 Ekim 2026",
   format:"Fiziki",location:"Elite World Grand Hotel İstanbul (Maltepe)",organizer:"Devnot",category:"Yazılım / Mimari",
   theme_description:"Modern Mimari, LLM & Web3",
   details:"Öne Çıkan Konular: AI ve Büyük Dil Modelleri (LLM), Web3 altyapıları, modern mimariler, mobil yazılım teknolojileri.",
   badge_color:"#059669"},
  {id:5,title:"ICBC 2026: 20. Int. Conf. on Blockchain & Cryptocurrencies",start_date:"2026-10-19",end_date:"2026-10-20",
   date_display:"19 - 20 Ekim 2026",format:"Hibrit",location:"İstanbul, Türkiye (Fiziki & Dijital)",organizer:"WASET",
   category:"Fintech / Blockchain",theme_description:"Blokzincir ve Kripto Varlık Akademik & Sektörel Konferansı",
   details:"Akademisyenler, araştırmacılar ve sektör profesyonelleri için uluslararası akademik konferans.",
   badge_color:"#7c3aed"},
  {id:6,title:"AI & Cyber Security Expo",start_date:"2026-10-20",end_date:"2026-10-21",date_display:"20 - 21 Ekim 2026 (10:00 - 18:00)",
   format:"Fiziki",location:"İTÜ SDKM, Ayazağa Kampüsü, Maslak / İstanbul",organizer:"İTÜ / Sektör Paydaşları",
   category:"Siber Güvenlik / AI",theme_description:"Yapay Zeka ve Siber Güvenlik Fuarı & Konferansı",
   details:"Fiziki Fuar, Konferans ve B2B Görüşme Alanları ile yapay zekanın siber güvenlikteki rolü ele alınmaktadır.",
   badge_color:"#dc2626"},
  {id:7,title:"20. İstanbul Bilişim Kongresi",start_date:"2026-11-05",end_date:"2026-11-05",date_display:"5 Kasım 2026",
   format:"Fiziki",location:"İstanbul Nişantaşı Üniversitesi Maslak Kampüsü",organizer:"Türkiye Bilişim Derneği (TBD) İstanbul Şubesi",
   category:"Bilişim / Regülasyon",theme_description:"Yapay Zekâ Destekli Gelecek: Teknoloji ve Toplum",
   details:"Teknolojik dönüşümün toplumsal, ekonomik ve hukuki boyutlarının tartışıldığı köklü bilişim buluşması.",
   badge_color:"#d97706"},
  {id:8,title:"Türkiye Yapay Zeka Zirvesi 2026 (TRAI)",start_date:"2026-11-11",end_date:"2026-11-12",date_display:"11 - 12 Kasım 2026",
   format:"Hibrit",location:"Wyndham Grand İstanbul Levent & Online",organizer:"TRAI (Türkiye Yapay Zeka Inisiyatifi)",
   category:"Yapay Zekâ / ML",theme_description:"Ajanlar Aramızda (Yapay Zeka Ajanları & Otonom Sistemler)",
   details:"11 Kasım Fiziki Buluşma, 12 Kasım Online Yayın ve Eğitimler (Ücretsiz erişim seçeneği). 100'den fazla konuşmacı.",
   badge_color:"#2563eb"},
  {id:9,title:"AB Yapay Zeka Yasası (EU AI Act) ve Türkiye Uyumu Webinarı",start_date:"2026-12-05",end_date:"2026-12-05",
   date_display:"5 Aralık 2026",format:"Online",location:"Online / Dijital Platformlar",
   organizer:"Sektörel YZ Dernekleri & Hukuk/Teknoloji Uzmanları",category:"Bilişim / Regülasyon",
   theme_description:"EU AI Act Standartları ve Türkiye Sanayi/Teknoloji Uyumu",
   details:"Katılım ücretsiz olup dijital platformlar üzerinden canlı yayınlanmaktadır. Regülasyon ve uyum süreçleri odaklıdır.",
   badge_color:"#4b5563"},
  {id:10,title:"AIT Summit (Artificial Intelligence & Technology Summit)",start_date:"2026-12-10",end_date:"2026-12-10",
   date_display:"10 Aralık 2026, Perşembe",format:"Fiziki",location:"İstanbul Marriott Hotel Asia (Ataşehir)",
   organizer:"AIT Community",category:"Yapay Zekâ / ML",theme_description:"Yapay Zekanın Gerçek Dünya Uygulamaları",
   details:"İş dünyası, yazılım mimarları ve teknoloji liderlerini buluşturan paneller, vaka çalışmaları, networking ve öğle yemeği.",
   badge_color:"#2563eb"}
];

/* Tarihe göre sıralama (backend'deki pandas sort_values karşılığı) */
EVENTS_DATA.sort((a, b) => a.start_date.localeCompare(b.start_date));

/* ===================== YARDIMCILAR ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = name => `<svg class="ic"><use href="#${name}"/></svg>`;
const tags = item => `
  <span class="tag" style="background-color:${esc(item.badge_color)}15;color:${esc(item.badge_color)}">${esc(item.category)}</span>
  <span class="tag tag-format">${esc(item.format)}</span>`;

/* ===================== BAŞLATMA ===================== */
document.addEventListener('DOMContentLoaded', function () {
  buildFilterOptions();
  setupEventListeners();
  applyFilters();
});

function buildFilterOptions() {
  const cats = [...new Set(EVENTS_DATA.map(e => e.category))].sort((a, b) => a.localeCompare(b, 'tr'));
  const fmts = [...new Set(EVENTS_DATA.map(e => e.format))].sort((a, b) => a.localeCompare(b, 'tr'));
  cats.forEach(c => $('categoryFilter').insertAdjacentHTML('beforeend', `<option value="${esc(c)}">${esc(c)}</option>`));
  fmts.forEach(f => $('formatFilter').insertAdjacentHTML('beforeend', `<option value="${esc(f)}">${esc(f)}</option>`));
}

function setupEventListeners() {
  $('categoryFilter').addEventListener('change', applyFilters);
  $('formatFilter').addEventListener('change', applyFilters);
  $('searchInput').addEventListener('input', applyFilters);
  $('btnTimeline').addEventListener('click', () => switchView('timeline'));
  $('btnCards').addEventListener('click', () => switchView('cards'));
  $('closeModalBtn').addEventListener('click', closeModal);
  $('eventModal').addEventListener('click', e => { if (e.target === $('eventModal')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  /* Kart tıklamaları: olay delegasyonu (inline onclick yok) */
  document.addEventListener('click', e => {
    const card = e.target.closest('[data-event-id]');
    if (card) openModal(Number(card.dataset.eventId));
  });
}

/* ===================== FİLTRELEME ===================== */
function applyFilters() {
  const categoryVal = $('categoryFilter').value;
  const formatVal = $('formatFilter').value;
  const searchVal = $('searchInput').value.trim().toLocaleLowerCase('tr');

  const filtered = EVENTS_DATA.filter(item => {
    const matchCategory = categoryVal === 'ALL' || item.category === categoryVal;
    const matchFormat = formatVal === 'ALL' || item.format === formatVal;
    const haystack = [item.title, item.location, item.theme_description, item.organizer, item.category, item.details]
      .join(' ').toLocaleLowerCase('tr');
    const matchSearch = !searchVal || haystack.includes(searchVal);
    return matchCategory && matchFormat && matchSearch;
  });

  updateKPIs(filtered);
  renderTimeline(filtered);
  renderCards(filtered);
}

function updateKPIs(events) {
  $('statTotal').textContent = events.length;
  $('statPhysical').textContent = events.filter(e => e.format === 'Fiziki').length;
  $('statHybrid').textContent = events.filter(e => e.format === 'Hibrit' || e.format === 'Online').length;
  $('statCategories').textContent = new Set(events.map(e => e.category)).size;
}

/* ===================== RENDER ===================== */
function renderTimeline(events) {
  const c = $('timelineContent');
  c.classList.toggle('is-empty', events.length === 0);
  if (!events.length) {
    c.innerHTML = '<div class="empty-state">Filtrelere uygun etkinlik bulunamadı.</div>';
    return;
  }
  c.innerHTML = events.map(item => `
    <div class="timeline-item">
      <div class="timeline-date">${esc(item.date_display)}</div>
      <div class="timeline-badge" style="border-color:${esc(item.badge_color)}"></div>
      <button type="button" class="timeline-card" data-event-id="${item.id}">
        <div class="card-tags">${tags(item)}</div>
        <div class="card-title">${esc(item.title)}</div>
        <div class="card-meta">
          <span>${icon('i-pin')} ${esc(item.location)}</span>
          <span>${icon('i-sitemap')} ${esc(item.organizer)}</span>
        </div>
        <div class="card-desc"><strong>Tema:</strong> ${esc(item.theme_description)}</div>
      </button>
    </div>`).join('');
}

function renderCards(events) {
  const c = $('cardsContent');
  if (!events.length) {
    c.innerHTML = '<div class="empty-state">Filtrelere uygun etkinlik bulunamadı.</div>';
    return;
  }
  c.innerHTML = events.map(item => `
    <button type="button" class="grid-card" data-event-id="${item.id}">
      <div>
        <div class="card-tags">${tags(item)}</div>
        <div class="card-title" style="margin-top:10px;">${esc(item.title)}</div>
        <div class="grid-date">${icon('i-calendar')} ${esc(item.date_display)}</div>
        <div class="card-desc" style="margin-top:10px;">
          <strong>Konum:</strong> ${esc(item.location)}<br>
          <strong>Tema:</strong> ${esc(item.theme_description)}
        </div>
      </div>
    </button>`).join('');
}

function switchView(viewType) {
  const isTimeline = viewType === 'timeline';
  $('timelineView').style.display = isTimeline ? 'block' : 'none';
  $('cardsView').style.display = isTimeline ? 'none' : 'block';
  $('btnTimeline').classList.toggle('active', isTimeline);
  $('btnCards').classList.toggle('active', !isTimeline);
}

/* ===================== MODAL ===================== */
function openModal(id) {
  const item = EVENTS_DATA.find(e => e.id === id);
  if (!item) return;
  $('modalBody').innerHTML = `
    <div style="margin-bottom:15px;" class="card-tags">${tags(item)}</div>
    <h2 id="modalTitle">${esc(item.title)}</h2>
    <p class="modal-date">${icon('i-calendar')} ${esc(item.date_display)}</p>
    <hr>
    <p class="modal-row"><strong>${icon('i-pin')} Konum / Mekân:</strong> ${esc(item.location)}</p>
    <p class="modal-row"><strong>${icon('i-sitemap')} Organizatör / Sponsor:</strong> ${esc(item.organizer)}</p>
    <p class="modal-row"><strong>${icon('i-bulb')} Ana Tema / Öne Çıkanlar:</strong> ${esc(item.theme_description)}</p>
    <p class="modal-details"><strong>Detaylar &amp; Katılım:</strong> ${esc(item.details)}</p>`;
  $('eventModal').classList.add('open');
}

function closeModal() {
  $('eventModal').classList.remove('open');
}
</script>
</body>
</html>
